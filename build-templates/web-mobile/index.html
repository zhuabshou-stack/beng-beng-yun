<!DOCTYPE html>
<html>
<head><script>
  // __virtualPortraitWindow：电脑横屏窗口下让引擎按竖屏比例渲染（页面 CSS 负责居中显示）
  (function () {
    var apply = function () {
      var isPortrait = window.innerWidth / Math.max(1, window.innerHeight) <= 0.62;
      if (isPortrait) return;
      var virtualWidth = Math.round(window.innerHeight * 0.4625);
      Object.defineProperty(window, 'innerWidth', { get: function () { return virtualWidth; }, configurable: true });
    };
    apply();
    window.addEventListener('resize', apply);
  })();
  </script>
  <meta charset="utf-8">

  <title>Cocos Creator | beng-beng-yun</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->

        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

</head>
